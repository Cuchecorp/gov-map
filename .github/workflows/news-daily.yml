name: news-daily

# Ingesta + clasificación DIARIA de NOTICIAS (Phase 136, NEWS-06) contra PROD.
# Cadencia L-V 20:30 UTC (~16:30 CL): tras el cierre de jornada, 30 min después de
# leyes-weekly para no solapar corridas.
#
# Dos etapas del régimen LOCKED (CLAUDE.md):
#   1. run-news-cli — RSS → R2 crudo content-addressed (hash-check ANTES de descargar;
#      re-corrida sin novedades = [skip] sin escribir) → carga a Supabase con el seen-ledger
#      (URL marcada vista ANTES de cualquier reject, 132-05).
#   2. clasificar-noticias-cli — SOLO noticia.estado='pendiente' (idempotente), cap duro
#      500 llamadas/corrida, ledger en llm_ledger, rechazos a noticia_dead_letter.
#      Sin DEEPSEEK_API_KEY ⇒ DEGRADACIÓN HONESTA: exit 0, cero datos fabricados (SC2).
#
# El backfill masivo JAMÁS corre aquí: es corrida LOCAL del operador
# (docs/runbooks/news-backfill-local.md). La etiqueta es interna (D-133-G) y el
# enrutamiento a fichas está fail-closed (T4/T9 no-medidos, 133-b).

on:
  schedule:
    - cron: "30 20 * * 1-5" # lunes a viernes 20:30 UTC (repo público, minutos ilimitados)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: news-daily
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install deps
        # --ignore-scripts: tsx trae su propio esbuild; evita ERR_PNPM_IGNORED_BUILDS (gate pnpm 11).
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Ingesta RSS (Etapa 1 R2 + Etapa 2 Supabase)
        env:
          SUPABASE_API_URL: ${{ secrets.SUPABASE_API_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: pnpm --filter @obs/news exec tsx src/run-news-cli.ts

      - name: Clasificar pendientes (cap 500, ledger, dead-letter)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_API_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: pnpm --filter @obs/news exec tsx src/clasificador/clasificar-noticias-cli.ts
